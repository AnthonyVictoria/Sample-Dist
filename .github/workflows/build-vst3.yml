name: Build VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clonar JUCE
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Compilar
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 2>&1 | tee cmake-out.txt
          cmake --build build --config Release --parallel 3 2>&1 | tee build-out.txt

      - name: Firmar y empaquetar
        run: |
          codesign --force --deep --sign - "build/SampleDistort_artefacts/Release/VST3/ShaqkeeDistort.vst3"
          ditto -c -k --keepParent "build/SampleDistort_artefacts/Release/VST3/ShaqkeeDistort.vst3" ShaqkeeDistort-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShaqkeeDistort-VST3
          path: ShaqkeeDistort-mac.zip

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            cmake-out.txt
            build-out.txt

name: Build VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clonar JUCE
        working-directory: SampleDistort
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Compilar
        working-directory: SampleDistort
        run: |
          set -o pipefail
          sed -i '' 's/COPY_PLUGIN_AFTER_BUILD TRUE/COPY_PLUGIN_AFTER_BUILD FALSE/' CMakeLists.txt
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 2>&1 | tee ../cmake-out.txt
          cmake --build build --config Release --parallel 3 2>&1 | tee ../build-out.txt

      - name: Firmar en ad-hoc
        working-directory: SampleDistort
        run: codesign --force --deep --sign - "build/SampleDistort_artefacts/Release/VST3/Sample Distort.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: SampleDistort-VST3
          path: SampleDistort/build/SampleDistort_artefacts/Release/VST3/Sample Distort.vst3

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            cmake-out.txt
            build-out.txt
